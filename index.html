<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NIS Homework</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231769aa'/%3E%3Ctext x='32' y='39' fill='white' font-family='Arial' font-size='19' font-weight='bold' text-anchor='middle'%3ENIS%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --blue: #1769aa;
      --blue-dark: #0f477a;
      --blue-soft: #ebf5ff;
      --pale-blue: #dceeff;
      --paper: #f3f8fc;
      --paper-2: #edf5fb;
      --surface: rgba(255, 255, 255, .88);
      --ink: #132a3a;
      --muted: #5e7485;
      --gold: #d5b35b;
      --line: rgba(19, 42, 58, .12);
      --shadow-soft: 0 18px 40px rgba(17, 76, 130, .12);
      --shadow-card: 0 10px 24px rgba(15, 71, 122, .08);
      font-family: "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(141, 196, 255, 0.3), transparent 30%),
        linear-gradient(180deg, var(--paper-2) 0%, var(--paper) 26%, #edf4fa 100%);
      color: var(--ink);
    }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; }
    .hidden { display: none !important; }
    .screen { min-height: 100vh; min-height: 100dvh; }

    .intro-splash {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(145deg, #102f48 0%, #0a2033 52%, #173d57 100%);
      color: white;
      opacity: 1;
      transition: opacity 350ms ease, visibility 350ms ease;
    }
    .intro-splash-exit { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-splash-content { position: relative; z-index: 1; display: grid; justify-items: center; animation: introBrandIn 900ms cubic-bezier(.2, .8, .2, 1) both; }
    .intro-logo { position: relative; width: 108px; height: 108px; border: 3px solid rgba(255, 255, 255, .84); border-radius: 24px; background: linear-gradient(180deg, #f9fcff 0%, #dcecff 100%); box-shadow: 0 18px 42px rgba(0, 0, 0, .28), 0 0 36px rgba(112, 188, 232, .18), inset 0 0 0 1px rgba(17, 78, 128, .12); }
    .intro-logo .book-mark { inset: 9px; }
    .intro-logo .nis { font-size: 22px; }
    .intro-logo .homework { font-size: 8px; }
    .intro-spinner { position: relative; width: 68px; height: 68px; margin-top: 28px; border: 1px solid rgba(234, 246, 255, .22); border-radius: 50%; box-shadow: 0 0 28px rgba(67, 153, 210, .12), inset 0 0 20px rgba(255, 255, 255, .035); }
    .intro-spinner::before { position: absolute; inset: 8px; border: 1px solid rgba(234, 246, 255, .16); border-radius: 50%; content: ""; }
    .intro-spinner::after { position: absolute; inset: -2px; border: 2px solid transparent; border-top-color: #f2ca70; border-right-color: rgba(112, 195, 238, .88); border-radius: 50%; animation: introSpin 1.15s linear infinite; content: ""; }
    .intro-spinner span { position: absolute; inset: 0; animation: introSpin 1.6s linear infinite reverse; }
    .intro-spinner span::before { position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; border: 2px solid #d9f0ff; border-radius: 50%; background: #398ac2; box-shadow: 0 0 12px rgba(115, 202, 255, .8); content: ""; transform: translateX(-50%); }
    @keyframes introBrandIn {
      0% { opacity: 0; transform: translateY(18px) scale(.88); }
      72% { opacity: 1; transform: translateY(-2px) scale(1.025); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes introSpin { to { transform: rotate(1turn); } }
    body.dark .intro-splash { background: radial-gradient(ellipse at center 42%, rgba(53, 112, 150, .2), transparent 42%), linear-gradient(145deg, #071521 0%, #0b2638 52%, #10344b 100%); }

    .login-screen {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .78), transparent 46%),
        linear-gradient(315deg, rgba(30, 115, 170, .12), transparent 52%),
        linear-gradient(135deg, #edf5fb 0%, #dceaf5 52%, #f2f7fb 100%);
      padding: max(28px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
    }
    .login-box {
      position: relative;
      z-index: 1;
      width: min(100%, 390px);
      padding: 22px 18px 16px;
      border: 1px solid rgba(23, 105, 170, .08);
      border-radius: 22px;
      background: rgba(255,255,255,.76);
      box-shadow: 0 24px 52px rgba(19, 53, 88, .15), inset 0 1px 0 rgba(255,255,255,.8);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .logo { position: relative; overflow: hidden; width: 96px; height: 96px; margin: 0 auto 18px; border: 3px solid rgba(255, 255, 255, .78); border-radius: 20px; background: linear-gradient(180deg, #ffffff 0%, #edf5ff 100%); box-shadow: 0 14px 28px rgba(17, 78, 128, .18), inset 0 0 0 1px rgba(17, 78, 128, .08); }
    .logo::before { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(23, 105, 170, .13), rgba(255, 255, 255, .22)); content: ""; }
    .book-mark { position: absolute; inset: 9px 8px 9px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 7px; border-radius: 12px; background: linear-gradient(180deg, #2f7bd2 0%, #0f4c8c 100%); color: #f8fbff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 8px 14px rgba(15, 76, 140, .22); text-align: center; }
    .book-mark::before, .book-mark::after { position: absolute; inset: 0; border-radius: 12px; content: ""; }
    .book-mark::before { background: linear-gradient(180deg, rgba(255,255,255,.18), transparent 22%); }
    .book-mark::after { inset: 8px 8px auto 8px; height: 2px; background: rgba(255,255,255,.18); border-radius: 999px; }
    .book-mark .nis { position: relative; z-index: 1; font-size: 19px; line-height: 1; font-weight: 800; letter-spacing: 2px; }
    .book-mark .homework { position: relative; z-index: 1; font-size: 7.5px; line-height: 1; font-weight: 700; letter-spacing: 2.4px; opacity: .92; }
    @media (prefers-reduced-motion: reduce) {
      .intro-splash-content, .intro-spinner::after, .intro-spinner span { animation: none; }
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 28px; }
    .subtitle { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .field { width: 100%; margin-top: 10px; padding: 14px; border: 1px solid #a8bdcc; border-radius: 10px; background: white; color: var(--ink); outline: none; }
    .field:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23, 105, 170, .14); }
    .primary { background: var(--blue); color: white; border-radius: 10px; padding: 13px 18px; font-weight: 600; }
    .switch-auth { display: inline-block; margin-top: 12px; color: var(--blue); background: transparent; font-size: 12px; }
    .wide { width: 100%; margin-top: 18px; }
    .error { min-height: 18px; margin-top: 7px; color: #b42318; font-size: 12px; text-align: left; }

    .app { min-height: 100vh; min-height: 100dvh; padding-bottom: calc(82px + env(safe-area-inset-bottom)); }
    .header {
      position: relative;
      padding: calc(20px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) 12px calc(22px + env(safe-area-inset-left));
      background: linear-gradient(135deg, #1b7ac9 0%, #145996 48%, #0d4478 100%);
      color: white;
      box-shadow: 0 8px 28px rgba(14, 67, 117, .22);
    }
    .header-icon {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top));
      right: calc(22px + env(safe-area-inset-right));
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.07));
      color: white;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 14px rgba(8, 30, 52, .14);
      transition: box-shadow 160ms ease, background 160ms ease;
    }
    .header-icon::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 9px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
    }
    .header-icon svg {
      position: relative;
      z-index: 1;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.12));
      transition: transform 220ms ease;
    }
    .header-icon:hover svg { transform: rotate(24deg); }
    .header-icon:hover {
      background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.1));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 18px rgba(8, 30, 52, .18);
    }
    .header-icon:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    .profile-button {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top));
      right: calc(76px + env(safe-area-inset-right));
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 2px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .58);
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.12));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 8px 18px rgba(10, 50, 90, .2);
    }
    .profile-button::after {
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 50%;
      content: "";
    }
    .profile-button img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; position: relative; z-index: 1; }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: white; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .brand-logo { position: relative; display: block; overflow: hidden; width: 42px; height: 42px; flex: 0 0 42px; border: 1px solid rgba(255, 255, 255, .7); border-radius: 10px; background: white; box-shadow: 0 3px 12px rgba(7, 46, 82, .22); }
    .brand-logo .book-mark { inset: 3px; gap: 3px; border-radius: 7px; }
    .brand-logo .book-mark .nis { font-size: 9px; letter-spacing: 1px; }
    .brand-logo .book-mark .homework { font-size: 3px; letter-spacing: .6px; }
    .brand-name { white-space: nowrap; }
    .header h2 { margin-top: 8px; font-size: 25px; letter-spacing: -.03em; }
    .profile-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #dfeeff; border: 2px solid rgba(255,255,255,.7); }
    .date { margin-top: 7px; color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    main { width: min(100%, 700px); margin: 0 auto; padding: 18px max(18px, env(safe-area-inset-right)) 100px max(18px, env(safe-area-inset-left)); }
    .section-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .card {
      margin-top: 10px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.62));
      box-shadow: var(--shadow-card);
      animation: contentEnter 360ms both;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .app.compact-mode .card { margin-top: 7px; padding: 11px; border-radius: 12px; }
    .app.compact-mode .section-row { margin-bottom: 8px; }
    .app.compact-mode .lesson-info span { margin-top: 2px; }
    .schedule-board-wrap { margin-top: 12px; padding: 0; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.22); box-shadow: 0 14px 26px rgba(15, 71, 122, .08); overflow-x: auto; }
    .schedule-board { width: 100%; min-width: 880px; border-collapse: collapse; table-layout: fixed; background: rgba(248, 250, 252, .72); }
    .schedule-board th, .schedule-board td { border: 1px solid rgba(19, 42, 58, .12); padding: 0; text-align: center; }
    .schedule-board thead th { background: rgba(214, 230, 242, .85); color: #193d56; font-size: 11px; font-weight: 700; padding: 8px 2px; }
    .schedule-board thead th:first-child { position: sticky; left: 0; z-index: 2; width: 60px; }
    .schedule-board tbody tr > :first-child { position: sticky; left: 0; z-index: 1; background: rgba(248,250,252,.96); color: #112a3d; font-size: 20px; font-weight: 700; width: 60px; }
    .schedule-board .cell { min-height: 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; padding: 7px 5px; font-size: 11px; }
    .schedule-board .cell strong { display: block; font-size: 12px; }
    .schedule-board .cell span { display: block; color: rgba(19, 42, 58, .78); font-size: 9px; }
    .schedule-board .c1 { background: #cfe7f8; }
    .schedule-board .c2 { background: #cfeef2; }
    .schedule-board .c3 { background: #dce7f7; }
    .schedule-board .c4 { background: #d9d3f6; }
    .schedule-board .c5 { background: #f7d3d2; }
    .schedule-board .c6 { background: #f2d8b7; }
    .schedule-board .c7 { background: #f5d5db; }
    .schedule-board .c8 { background: #c8e6d0; }
    .schedule-board .c9 { background: #d3ebf8; }
    .schedule-week { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; margin-top: 12px; }
    .schedule-day { min-width: 0; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-card); }
    .schedule-day h3 { margin: 0 0 10px; color: var(--blue-dark); font-size: 16px; }
    .schedule-day ol { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .schedule-day li { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 7px 9px; border-radius: 10px; background: var(--blue-soft); }
    .schedule-lesson-number { display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 28px; border-radius: 8px; background: var(--blue); color: white; font-size: 12px; font-weight: 700; }
    .schedule-lesson-info { display: grid; gap: 2px; min-width: 0; }
    .schedule-lesson-info strong { overflow-wrap: anywhere; font-size: 13px; }
    .schedule-lesson-info span { color: var(--muted); font-size: 11px; }
    body.dark .schedule-day { background: var(--surface); }
    body.dark .schedule-day li { background: rgba(74, 147, 199, .18); }
    @keyframes contentEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    #content.section-transition { animation: sectionTransition 280ms cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes sectionTransition { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .primary, .small-btn, .secondary, .nav-btn { transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease; }
    .primary {
      background: linear-gradient(135deg, var(--blue) 0%, #2c8ad9 100%);
      color: white;
      box-shadow: 0 10px 20px rgba(23, 105, 170, .2);
    }
    .primary:hover, .small-btn:hover, .secondary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15, 71, 122, .14); }
    .next { padding: 17px; background: linear-gradient(135deg, #0f5b9a 0%, #1a75bd 100%); color: white; border-radius: 18px; box-shadow: var(--shadow-soft); }
    .next .eyebrow { color: var(--gold); }
    .next-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 5px; }
    .next strong { font-size: 19px; }
    .lesson, .teacher { display: flex; align-items: center; gap: 14px; }
    .lesson-info, .teacher-info { flex: 1; }
    .lesson-info strong, .teacher-info strong { display: block; font-size: 14px; }
    .lesson-info span, .teacher-info span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pale-blue); }
    .mode { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
    .small-btn { padding: 8px 10px; border-radius: 9px; background: var(--pale-blue); color: var(--blue); font-size: 11px; font-weight: 600; }
    .small-btn.active { background: var(--blue); color: white; }
    .check { width: 20px; height: 20px; accent-color: var(--blue); }
    .teacher-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--pale-blue); color: var(--blue); font-weight: 700; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .settings-row strong { display: block; font-size: 15px; }
    .settings-back { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--blue); font-weight: 600; }
    .settings-back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .switch { width: 44px; height: 24px; appearance: none; border-radius: 20px; background: #b4c5d0; transition: .2s; }
    .switch:checked { background: var(--blue); }
    .switch::before { content: ""; display: block; width: 20px; height: 20px; margin: 2px; border-radius: 50%; background: white; transition: .2s; }
    .switch:checked::before { transform: translateX(20px); }

    .bottom-nav {
      position: fixed;
      z-index: 5;
      right: auto;
      bottom: calc(8px + env(safe-area-inset-bottom));
      left: 50%;
      width: max-content;
      max-width: calc(100% - 24px);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 60px));
      align-items: center;
      padding: 5px 8px 6px;
      border: 1px solid rgba(255, 255, 255, .4);
      border-radius: 18px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 12px 28px rgba(15, 71, 122, .12);
      backdrop-filter: blur(22px) saturate(145%);
      -webkit-backdrop-filter: blur(22px) saturate(145%);
      transform: translateX(-50%);
    }
    .admin-mode .bottom-nav { grid-template-columns: repeat(6, minmax(0, 60px)); }
    .ai-menu { position: absolute; right: 0; bottom: calc(100% + 10px); left: 0; display: none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 10px 28px rgba(15, 71, 122, .18); }
    .ai-menu.open { display: grid; }
    .ai-menu a { min-width: 0; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 8px; color: var(--ink); font-size: 10px; text-decoration: none; }
    .ai-menu a:hover, .ai-menu a:focus-visible { background: var(--pale-blue); outline: none; }
    .ai-menu img { width: 24px; height: 24px; object-fit: contain; }
    .nav-btn { min-width: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; padding: 4px 2px; border-radius: 12px; background: transparent; color: var(--muted); text-align: center; }
    .nav-btn span { display: none; }
    .nav-btn svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.08));
      transition: transform 160ms ease;
    }
    .nav-btn:hover svg { transform: translateY(-1px) scale(1.06); }
    .nav-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .nav-btn:hover:not(.active) { background: rgba(23, 105, 170, .08); color: var(--blue); }
    .nav-btn.active {
      background: linear-gradient(180deg, rgba(220, 238, 255, 1), rgba(210, 230, 247, .9));
      color: var(--blue);
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(23, 105, 170, .1), 0 3px 8px rgba(23, 105, 170, .08);
    }
    .nav-btn.active svg { stroke-width: 2; filter: drop-shadow(0 1px 1px rgba(23, 105, 170, .18)); }
    .profile-card { display: flex; align-items: center; gap: 12px; }
    .profile-avatar-lg { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #dfeeff; border: 2px solid rgba(23, 105, 170, .12); }
      .profile-avatar-xl { width: 72px; height: 72px; }
    .avatar-upload { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: var(--pale-blue); color: var(--blue); font-weight: 600; cursor: pointer; }
    .avatar-upload input { display: none; }
    .user-profile-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .user-profile-row:last-child { border-bottom: 0; }
    .user-profile-row strong { display: block; }
    .user-profile-row span { display: block; color: var(--muted); font-size: 12px; }
    dialog { width: min(90%, 380px); border: 0; border-radius: 18px; padding: 22px; color: var(--ink); box-shadow: 0 18px 60px rgba(0, 0, 0, .25); }
    dialog::backdrop { background: rgba(7, 21, 33, .42); }
    dialog h3 { margin: 0 0 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .secondary { padding: 10px 13px; border-radius: 9px; background: var(--pale-blue); color: var(--blue); }
    .olympiad-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .olympiad-head h3 { margin-top: 5px; font-size: 20px; }
    .olympiad-head p { margin-top: 5px; }

    .olympiad-dropzone:hover, .olympiad-dropzone.dragging { border-color: var(--blue); background: var(--pale-blue); transform: translateY(-1px); }
    .olympiad-dropzone label { display: grid; justify-items: center; gap: 6px; }
    .olympiad-upload-icon { width: 38px; height: 38px; display: grid; place-items: center; margin-bottom: 3px; border-radius: 50%; background: white; color: var(--blue); font-size: 22px; box-shadow: 0 3px 12px rgba(15, 71, 122, .1); }

    .stats-user { padding: 15px; }

    .stats-user-head strong { overflow-wrap: anywhere; }
    .stats-progress { color: var(--blue); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .stats-task { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12px; }

    @media (max-width: 480px) {

  <script>

      : { ...task, id: task.id || `task-${Date.now()}-${index}` });
    localStorage.setItem('plannerTasks', JSON.stringify(tasks));
    let taskProgress = JSON.parse(localStorage.getItem('plannerTaskProgress') || '[]');
    let taskActivity = JSON.parse(localStorage.getItem('plannerTaskActivity') || '[]');
    const lessons = [

      ['Физика', 'Лаборатория 3'], ['История Казахстана', 'Кабинет 302'],
      ['Информатика', 'Компьютерный класс'], ['Биология', 'Кабинет 206'],
      ['География', 'Кабинет 118'], ['Русский язык', 'Кабинет 112']
    ];
    const scheduleDays = [
      { name: 'Пн', lessons: { 1: ['CHB-103', 'Geo', 2], 3: ['GEK-208', 'Chem', 2], 5: ['CHB-102', 'HKz', 2], 7: ['CHB-203', 'Bio'], 8: ['GEK-218', 'Math'] } },
      { name: 'Вт', lessons: { 1: ['T-304', 'English', 2], 3: ['T-103', 'Kazakh', 2], 5: ['GEK-109', 'Art', 2], 7: ['T-204', 'Russian', 2] } },
      { name: 'Ср', lessons: { 1: ['GEK-218', 'Math', 2], 3: ['GEK-208', 'Chem'], 4: ['GEK-201', 'WH'], 5: ['PHM-106', 'Phys', 2], 7: ['T-103', 'Kazakh', 2] } },
      { name: 'Чт', lessons: { 1: ['CHB-203', 'Bio', 2], 3: ['SportHall', 'PE', 2], 5: ['T-105', 'Hour of Dev'], 6: ['GEK-218', 'Math'], 7: ['T-103', 'Kazakh'], 8: ['GEK-303', 'FoES'] } },
      { name: 'Пт', lessons: { 1: ['GEK-219', 'CS', 2], 3: ['PHM-106', 'Phys'], 4: ['T-204', 'Russian'], 5: ['T-104', 'Math', 2], 7: ['T-304', 'English', 2], 9: ['GEK-219', 'Global Scholars'] } }
    ];
    const content = document.querySelector('#content');
    const title = document.querySelector('#pageTitle');

    async function hashSecret(secret, salt) {
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' }, key, 256);
      return Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
    }
    function createSalt() { return crypto.getRandomValues(new Uint8Array(16)); }
    function encodeSalt(salt) { return Array.from(salt, byte => byte.toString(16).padStart(2, '0')).join(''); }
    function decodeSalt(salt) { return new Uint8Array(salt.match(/.{2}/g).map(byte => parseInt(byte, 16))); }
    async function createCredential(secret) {
      const salt = createSalt();
      return { salt: encodeSalt(salt), hash: await hashSecret(secret, salt) };
    }
    async function matchesCredential(secret, credential) {
      return credential && await hashSecret(secret, decodeSalt(credential.salt)) === credential.hash;
    }
    async function requestFullscreenIfPossible() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();

      } catch (error) {
        // Fullscreen is optional; ignore browser restrictions.
      }

      localStorage.setItem('plannerTasks', JSON.stringify(tasks));
    }
    function persistTaskProgress() {
      localStorage.setItem('plannerTaskProgress', JSON.stringify(taskProgress));
    }
    function persistTaskActivity() {
      localStorage.setItem('plannerTaskActivity', JSON.stringify(taskActivity));
    }
    function syncScreenInteractivity() {
      const loginScreen = document.querySelector('#loginScreen');
      const app = document.querySelector('#app');
      if (loginScreen) loginScreen.inert = loginScreen.classList.contains('hidden');
      if (app) app.inert = app.classList.contains('hidden');
    }
    function openApp(admin = false, login = '') {
      isAdmin = admin;
      currentUserLogin = login;
      if (rememberSession) localStorage.setItem(savedSessionKey, JSON.stringify({ login, isAdmin: admin }));
      document.querySelector('#app').classList.toggle('compact-mode', localStorage.getItem('plannerCompactView') === 'true');
      setCurrentUserAvatarInHeader();
      document.querySelector('#app').classList.toggle('admin-mode', admin);
      document.querySelector('[data-page="stats"]').classList.toggle('hidden', !admin);
      document.querySelector('#loginScreen').classList.add('hidden');
      document.querySelector('#app').classList.remove('hidden');
      syncScreenInteractivity();
      render();
      requestFullscreenIfPossible();
    }
    function logout() {
      if (localStorage.getItem('plannerConfirmLogout') !== 'false' && !confirm('Выйти из аккаунта?')) return;
      isAdmin = false;
      currentUserLogin = '';
      localStorage.removeItem(savedSessionKey);
      const profileButton = document.querySelector('#profileButton img');
      if (profileButton) profileButton.src = getUserAvatar('user');
      document.querySelector('#app').classList.remove('admin-mode');
      document.querySelector('[data-page="stats"]').classList.add('hidden');
      document.querySelector('#app').classList.add('hidden');
      document.querySelector('#loginScreen').classList.remove('hidden');
      document.querySelector('#loginForm').reset();
      document.querySelector('#loginError').textContent = '';
      isRegisterMode = false;
      document.querySelector('#login').classList.remove('hidden');
      document.querySelector('#password').classList.remove('hidden');
      document.querySelector('#switchAuth').classList.remove('hidden');
      document.querySelector('#submitAuth').textContent = 'Войти';
      document.querySelector('#switchAuth').textContent = 'Создать обычный аккаунт';
      syncScreenInteractivity();
    }
    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (error) {
        document.querySelector('#loginError').textContent = 'Полноэкранный режим недоступен в этом браузере.';
      }
    }

    function updateCurrentDate() {
      const parts = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Asia/Almaty',
        weekday: 'long',

          blob: base64ToBlob(savedFile.base64, savedFile.type)
        }));
        if (!confirm(`Восстановить копию от ${new Date(backup.createdAt).toLocaleString('ru-RU')}? Текущие задания, пользователи, статистика и файлы будут заменены.`)) return;
        await runOlympiadRequest('readwrite', store => {
          const clearRequest = store.clear();
          restoredFiles.forEach(savedFile => store.put(savedFile));
          return clearRequest;
        });
        backupStorageKeys.forEach(key => {
          if (Object.prototype.hasOwnProperty.call(backup.localData, key)) localStorage.setItem(key, backup.localData[key]);
          else localStorage.removeItem(key);
        });
        Object.keys(localStorage).filter(key => key.startsWith('plannerAvatar:')).forEach(key => localStorage.removeItem(key));
        Object.entries(backup.avatars).forEach(([login, avatar]) => localStorage.setItem(`plannerAvatar:${login.toLowerCase()}`, avatar));
        if (status) status.textContent = 'Копия восстановлена. Страница перезагрузится.';
        location.reload();
      } catch (error) {
        if (status) status.textContent = 'Не удалось восстановить копию. Проверьте файл и свободное место.';
      } finally {
        input.value = '';
      }
    }
    async function renderOlympiadFiles() {
      if (document.querySelector('.nav-btn.active')?.dataset.page !== 'olympiads') return;
      try {
        const files = await runOlympiadRequest('readonly', store => store.getAll());
        if (document.querySelector('.nav-btn.active')?.dataset.page !== 'olympiads') return;
        if (!isAdmin && files.length === 0) {
          content.innerHTML = '';
          title.textContent = '';
          return;
        }
        if (!isAdmin && !document.querySelector('#olympiadFiles')) {
          content.innerHTML = `${olympiadHeaderMarkup()}<div id="olympiadFiles"></div>`;
          title.textContent = 'Олимпиады';
        }
        const currentList = document.querySelector('#olympiadFiles');
        if (!currentList) return;
        const count = document.querySelector('#olympiadCount');
        if (count) count.textContent = `${files.length} ${files.length === 1 ? 'файл' : files.length >= 2 && files.length <= 4 ? 'файла' : 'файлов'}`;
        currentList.innerHTML = files.length
          ? files.sort((first, second) => Date.parse(second.uploadedAt) - Date.parse(first.uploadedAt)).map(file => {
            const extension = file.name.split('.').pop().toUpperCase();
            const typeClass = extension === 'PDF' ? 'pdf' : 'word';
            return `<article class="card olympiad-file"><div class="olympiad-file-kind ${typeClass}" aria-hidden="true">${escapeHtml(extension)}</div><div class="olympiad-file-info"><strong>${escapeHtml(file.name)}</strong><span>${formatFileSize(file.blob.size)} · ${new Date(file.uploadedAt).toLocaleDateString('ru-RU')}</span></div><div class="olympiad-file-actions"><button class="small-btn" aria-label="Скачать ${escapeHtml(file.name)}" onclick="downloadOlympiadFile(${file.id})">Скачать</button>${isAdmin ? `<button class="small-btn" aria-label="Удалить ${escapeHtml(file.name)}" onclick="deleteOlympiadFile(${file.id})">Удалить</button>` : ''}</div></article>`;
          }).join('')
          : isAdmin ? '<p class="muted olympiad-empty">Здесь появятся загруженные задания и материалы.</p>' : '';
      } catch (error) {
        const currentList = document.querySelector('#olympiadFiles');
        if (currentList) currentList.innerHTML = '<p class="error">Не удалось открыть хранилище файлов в этом браузере.</p>';
      }
    }
    function notifyOlympiadFilesChanged() {
      olympiadChannel?.postMessage('files-changed');
      try { localStorage.setItem('plannerOlympiadsUpdatedAt', String(Date.now())); } catch (error) {}
    }
    if (olympiadChannel) olympiadChannel.addEventListener('message', event => {
      if (event.data === 'files-changed') renderOlympiadFiles();
    });
    window.addEventListener('storage', event => {
      if (event.key === 'plannerOlympiadsUpdatedAt') renderOlympiadFiles();
      if (event.key === 'plannerTasks' && event.newValue) tasks = JSON.parse(event.newValue);
      if (event.key === 'plannerTaskProgress') taskProgress = JSON.parse(event.newValue || '[]');
      if (event.key === 'plannerTaskActivity') taskActivity = JSON.parse(event.newValue || '[]');
      const activePage = document.querySelector('.nav-btn.active')?.dataset.page;
      if (activePage === 'tasks' && ['plannerTasks', 'plannerTaskProgress'].includes(event.key)) render('tasks');
      if (activePage === 'stats' && ['plannerTasks', 'plannerTaskProgress', 'plannerTaskActivity'].includes(event.key)) render('stats');
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && document.querySelector('#olympiadFiles')) renderOlympiadFiles();
    });
    function formatFileSize(bytes) {
      if (bytes < 1024) return `${bytes} Б`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} КБ`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} МБ`;
    }
    async function uploadOlympiadFiles(event) {
      const input = event.currentTarget;
      const status = document.querySelector('#olympiadUploadStatus');
      const files = Array.from(event.files || input.files || []);
      if (!isAdmin || files.length === 0) return;
      const validFiles = files.filter(file => /\.(pdf|doc|docx)$/i.test(file.name));
      if (validFiles.length !== files.length) {
        status.textContent = 'Можно загружать только PDF- и Word-файлы.';
        return;
      }
      if (validFiles.some(file => file.size > 20 * 1024 * 1024)) {
        status.textContent = 'Размер каждого файла не должен превышать 20 МБ.';
        return;
      }
      try {
        for (const file of validFiles) {
          await runOlympiadRequest('readwrite', store => store.add({ name: file.name, blob: file, uploadedAt: new Date().toISOString() }));
        }
        notifyOlympiadFilesChanged();
        status.textContent = `Загружено файлов: ${validFiles.length}`;
        input.value = '';
        await renderOlympiadFiles();
      } catch (error) {
        status.textContent = 'Не удалось сохранить файлы. Проверьте свободное место в браузере.';
      }
    }
    async function downloadOlympiadFile(id) {
      try {
        const file = await runOlympiadRequest('readonly', store => store.get(Number(id)));
        if (!file) return;
        const url = URL.createObjectURL(file.blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = file.name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) {
        alert('Не удалось скачать файл.');
      }
    }
    async function deleteOlympiadFile(id) {
      if (!isAdmin || !confirm('Удалить этот файл?')) return;
      try {
        await runOlympiadRequest('readwrite', store => store.delete(Number(id)));
        notifyOlympiadFilesChanged();
        await renderOlympiadFiles();
      } catch (error) {
        alert('Не удалось удалить файл.');
      }
    }
    document.querySelector('#loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const login = document.querySelector('#login').value.trim();
      const password = document.querySelector('#password').value;
      const error = document.querySelector('#loginError');
      error.textContent = '';
      try {
        if (!login || !password) { error.textContent = 'Введи логин и пароль'; return; }
        if (isRegisterMode) {
          if (adminAccounts.some(account => account.login.toLowerCase() === login.toLowerCase()) || registeredAccounts.some(account => account.login.toLowerCase() === login.toLowerCase())) { error.textContent = 'Такой логин уже занят'; return; }
          const passwordCredential = await createCredential(password);
          registeredAccounts.push({ login, passwordCredential });
          persistRegisteredAccounts();
          isRegisterMode = false;
          document.querySelector('#submitAuth').textContent = 'Войти';
          document.querySelector('#switchAuth').textContent = 'Создать обычный аккаунт';
          error.textContent = 'Аккаунт сохранен. Теперь войди с логином и паролем.';
          return;
        }
        const adminMatch = adminAccounts.find(item => item.login.toLowerCase() === login.toLowerCase() && item.password === password);
        if (adminMatch) { openApp(true, adminMatch.login); return; }
        const account = registeredAccounts.find(item => item.login.toLowerCase() === login.toLowerCase());
        if (!account || !await matchesCredential(password, account.passwordCredential)) { error.textContent = 'Аккаунт не найден или пароль неверен'; return; }
        openApp(false, account.login);
      } catch (authError) {
        error.textContent = 'Не удалось сохранить аккаунт в этом браузере.';
      }
    });
    document.querySelectorAll('.nav-btn[data-page]').forEach(btn => btn.addEventListener('click', () => render(btn.dataset.page)));
    document.querySelector('#cancelEdit').addEventListener('click', () => document.querySelector('#editDialog').close());
    document.querySelector('#saveEdit').addEventListener('click', () => { const teacher = { role: document.querySelector('#teacherRole').value.trim(), room: document.querySelector('#teacherRoom').value.trim() }; if (!teacher.role || !teacher.room) return; if (editingTeacherIndex === null) teachers.push(teacher); else teachers[editingTeacherIndex] = teacher; persistTeachers(); document.querySelector('#editDialog').close(); render('teachers'); });
    document.querySelector('#deleteTeacher').addEventListener('click', () => { if (editingTeacherIndex !== null && confirm('Удалить этого учителя?')) { teachers.splice(editingTeacherIndex, 1); persistTeachers(); document.querySelector('#editDialog').close(); render('teachers'); } });
    document.querySelector('#switchAuth').addEventListener('click', () => { isRegisterMode = !isRegisterMode; document.querySelector('#submitAuth').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти'; document.querySelector('#switchAuth').textContent = isRegisterMode ? 'У меня уже есть аккаунт' : 'Создать обычный аккаунт'; document.querySelector('#loginError').textContent = ''; });
    document.querySelector('#cancelLesson').addEventListener('click', () => document.querySelector('#lessonDialog').close());
    document.querySelector('#saveLesson').addEventListener('click', () => { const lesson = [document.querySelector('#lessonSubject').value.trim(), document.querySelector('#lessonRoom').value.trim()]; if (lesson.every(Boolean)) { if (editingLessonIndex === null) lessons.push(lesson); else lessons[editingLessonIndex] = lesson; document.querySelector('#lessonDialog').close(); render('schedule'); } });
    document.querySelector('#cancelTask').addEventListener('click', () => document.querySelector('#taskDialog').close());
    document.querySelector('#saveTask').addEventListener('click', () => {
      const subject = document.querySelector('#taskSubject').value.trim();
      const description = document.querySelector('#taskDescription').value.trim();
      const due = document.querySelector('#taskDue').value.trim();
      if (!subject || !description || !due) return;
      const isNewTask = editingTaskIndex === null;
      const task = isNewTask ? { id: newTaskId(), subject, description, due } : { ...tasks[editingTaskIndex], subject, description, due };
      if (isNewTask) tasks.push(task);
      else tasks[editingTaskIndex] = task;
      persistTasks();
      recordTaskActivity(isNewTask ? 'Добавил задание' : 'Изменил задание', task);
      document.querySelector('#taskDialog').close();
      render('tasks');
    });
    document.querySelector('#deleteTask').addEventListener('click', () => {
      if (editingTaskIndex === null || !confirm('Удалить это задание?')) return;
      const [task] = tasks.splice(editingTaskIndex, 1);
      taskProgress = taskProgress.filter(item => item.taskId !== task.id);
      persistTaskProgress();
      persistTasks();
      recordTaskActivity('Удалил задание', task);
      document.querySelector('#taskDialog').close();
      render('tasks');
    });
    applyTheme();
    document.querySelector('#settingsButton').addEventListener('click', () => {
      if (currentPage !== 'settings') previousPage = currentPage;
      render('settings');
    });
    const aiMenu = document.querySelector('#aiMenu');
    const aiMenuButton = document.querySelector('#aiMenuButton');
    function closeAiMenu() {
      aiMenu.classList.remove('open');
      aiMenuButton.setAttribute('aria-expanded', 'false');
    }
    aiMenuButton.addEventListener('click', () => {
      const isOpen = aiMenu.classList.toggle('open');
      aiMenuButton.setAttribute('aria-expanded', String(isOpen));
    });
    document.addEventListener('click', event => {
      if (!event.target.closest('#aiMenu') && !event.target.closest('#aiMenuButton')) closeAiMenu();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeAiMenu();
    });
    aiMenu.addEventListener('click', event => {
      if (event.target.closest('a')) closeAiMenu();
    });
    document.addEventListener('fullscreenchange', () => {
      const button = document.querySelector('#settingsButton');
      if (button) button.setAttribute('title', document.fullscreenElement ? 'Полный экран активен' : 'Настройки');
    });
    restoreRememberedSession();
    const introSplash = document.querySelector('#introSplash');
    const loginScreen = document.querySelector('#loginScreen');
    const app = document.querySelector('#app');
    loginScreen.inert = true;
    app.inert = true;
    window.setTimeout(() => {
      introSplash.classList.add('intro-splash-exit');
      syncScreenInteractivity();
      window.setTimeout(() => introSplash.remove(), 450);
    }, 1600);
    updateCurrentDate();
    setInterval(updateCurrentDate, 60000);
  </script>
</body>
</html>
